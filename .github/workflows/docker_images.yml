name: Build & Push Docker Images

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Set up Docker Buildx ────────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 3. Log in to GHCR ─────────────────────────────────────────────────────
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── 4. Pre-pull heavy base images (avoids session timeout mid-build) ───────
      - name: Pre-pull base images
        run: |
          docker pull ghcr.io/cirruslabs/flutter:3.27.3
          docker pull nginx:alpine
          docker pull python:3.11-slim
          docker pull mcr.microsoft.com/playwright/python:v1.44.0-jammy 2>/dev/null || true

      # ── 5. Build & push — Backend ──────────────────────────────────────────────
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          push: ${{ github.event_name == 'push' }}   # only push on merge, not on PRs
          tags: |
            ghcr.io/${{ github.repository_owner }}/steamagent/backend:latest
            ghcr.io/${{ github.repository_owner }}/steamagent/backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # ── 6. Build & push — Frontend ─────────────────────────────────────────────
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/steamagent/frontend:latest
            ghcr.io/${{ github.repository_owner }}/steamagent/frontend:${{ github.sha }}
          cache-from: |
            type=gha,scope=frontend
            type=registry,ref=ghcr.io/cirruslabs/flutter:3.27.3
          cache-to: type=gha,mode=max,scope=frontend